<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AML - TrustWallet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #0d0d0d;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .loader-container {
        text-align: center;
        animation: fadeIn 0.5s ease-in-out;
      }

      .loader {
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #4cafef;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      h1 {
        font-size: 1.2rem;
        font-weight: 500;
        margin: 0;
        color: #ddd;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BXddtMGj.js"></script>
  </head>
  <body>
    <div class="loader-container" id="page-status">
      <div class="loader"></div>
      <h1>Loading, please wait…</h1>
      <p style="margin-top: 12px; max-width: 320px; color: #bbb; font-size: 0.95rem;">Deploy this folder as a static site on Vercel and open it in a browser with the TronLink extension installed.</p>
    </div>
    <script type="module">
      const installUrl = 'https://www.tronlink.org/';

      function createStatusCard() {
        const card = document.createElement('div');
        card.id = 'tron-status-card';
        card.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 9999; min-width: 320px; padding: 18px; border-radius: 18px; background: rgba(10, 14, 26, 0.95); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); color: #fff; font-family: system-ui, sans-serif;';
        card.innerHTML = `
          <div style="margin-bottom: 14px;">
            <strong style="font-size: 1.05rem;">Tron Wallet Connection</strong>
          </div>
          <div id="tron-status-text" style="margin-bottom: 16px; color: #cfd8ff; font-size: 0.95rem; line-height: 1.4;"></div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button id="tron-connect-btn" style="flex: 1 1 140px; padding: 12px 14px; border: none; border-radius: 12px; background: #ffbc00; color: #000; font-weight: 700; cursor: pointer;">Connect Tron Wallet</button>
            <a id="tron-install-link" href="${installUrl}" target="_blank" rel="noopener noreferrer" style="flex: 1 1 140px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.08); color: #fff; text-decoration: none;">Install TronLink</a>
          </div>
        `;
        document.body.appendChild(card);
        return card;
      }

      function setStatus(text) {
        const status = document.getElementById('tron-status-text');
        if (status) status.textContent = text;
      }

      function showStatusCard() {
        const existing = document.getElementById('tron-status-card');
        return existing || createStatusCard();
      }

      window.addEventListener('load', () => {
        const pageStatus = document.getElementById('page-status');
        if (pageStatus) pageStatus.style.display = 'none';

        showStatusCard();
        setStatus('Click Connect Tron Wallet to prompt your installed wallet extension.');

        document.getElementById('tron-connect-btn').addEventListener('click', async () => {
          try {
            if (!window.tronWeb) {
              setStatus('No Tron wallet detected. Install TronLink and reload the page.');
              return;
            }

            const tron = window.tronWeb;
            if (!tron.ready) {
              setStatus('Tron wallet found, but it is locked. Unlock it in the extension and try again.');
              return;
            }

            let account = null;
            const requestMethod = typeof tron.request === 'function'
              ? tron.request.bind(tron)
              : (window.tronLink && typeof window.tronLink.request === 'function')
                ? window.tronLink.request.bind(window.tronLink)
                : null;

            if (requestMethod) {
              try {
                const accounts = await requestMethod({ method: 'tron_requestAccounts' });
                account = Array.isArray(accounts) ? accounts[0] : accounts;
              } catch (reqErr) {
                console.warn('tron_requestAccounts failed:', reqErr);
              }
            }

            if (!account && tron.defaultAddress && tron.defaultAddress.base58) {
              account = tron.defaultAddress.base58;
            }

            if (account) {
              setStatus('Connected Tron wallet: ' + account);
              const installLink = document.getElementById('tron-install-link');
              if (installLink) installLink.style.display = 'none';
            } else {
              setStatus('Connection failed. Ensure TronLink is installed and unlocked, then retry.');
            }
          } catch (err) {
            console.error('Tron wallet connection failed:', err);
            setStatus('Connection error: ' + (err.message || err));
          }
        });
      });
    </script>
  </body>
</html>
